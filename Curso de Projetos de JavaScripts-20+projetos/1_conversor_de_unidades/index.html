<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Unidades</title>
    <link rel="stylesheet" href="styles.css">
    
</head>
<body>
    <marquee> Bora brincar com HTML, CSS e JavaScript</marquee>
    <h2>Meu primeiro projeto de JavaScript</h2>
    <div class="container">
       <h1>Conversor de Unidades</h1>
       <div class="input-group">
        <label for="input">Informe a quantidade:</label>
        <input type="number" id="input" name="input" placeholder="0">
       </div>
       <div class="input-group">
        <label for="From">De:</label>
        <select name="from" id="from">
            <option value="m">Metro(s):</option>
            <option value="km">Quilômetro(s):</option>
            <option value="cm">Centrimetro(s):</option>
            <option value="mm">Milimetro(s):</option>
            
        </select>
       </div>
       <div class="input-group">
        
          <label for="to">Para:</label>
        <select name="to" id="to">
            <option value="m">Metro(s):</option>
            <option value="km">Quilômetro(s):</option>
            <option value="cm">Centrimetro(s):</option>
            <option value="mm">Milimetro(s):</option>
            
        </select>
       </div>
       <button id="convert-btn">Converter</button>
       <div class="output-group">
         <label for="output"> Resultado:</label>
         <input type="text" id="output" readonly>
       </div>
       <div id="message"></div>
    </div>
     <marquee> Bora brincar com HTML, CSS e JavaScript</marquee>
</body>

</html>
