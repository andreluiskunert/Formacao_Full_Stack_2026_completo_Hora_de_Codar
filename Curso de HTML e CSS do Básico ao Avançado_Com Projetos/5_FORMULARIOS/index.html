<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários HTML </title>
    <link rel="stylesheet" href="CSS/estilo.css">
</head>
<body>
    <div class="corpo">
          <marquee>Curso de HTML e CSS do básico ao avançado - com projetos</marquee>
    <h1>Formultários</h1>
    <!-- 1ªFormulário -->
     <!-- 2ªAtributos dos formulários -->
     <form action="register.php" method="GET">
        <label>Nome:</label>
        <input type="text">
         <div>
            <!-- 3ª atributo name -->
         </div>
         <div>
            <!-- 4ª atributo label  -->
            <label for="age">Idade:</label>
            <input type="text" name="age"/>
         </div>
         <!-- 6ª Select -->
          <div>
            <label for="job">Selecione a sua profissão:</label>
            <select name="job">
                <option value="">escolha</option>
                <option value="programador"> Programador</option>
                <option value="analista_de_qa"> Analista de QA</option>
                <option value="devops"> Devops</option>
                <option value="engenheiro_de_ia"> Engenheiro_de_IA</option>
            </select>
          </div>
          <!-- 7ª Atributo selected
           Domingo_D'noite, 25/10/2026 -->
           <div>
            <label for="contract">Você leu os termos do contrato?</label>
            <select name="contract">
                <!-- <option value="escolha">escolha</option> -->
                <option value="sim">Sim</option>
                <option value="nao" selected>Não</option>
            </select>
           </div>
           <!-- 8ª Multiplas Opções-->
            <div>
                <label for="cursos">Selecione os cursos que fez:</label>
                <select name="cursos" multiple>
               
                    <option value="web_designer">Web Designer</option>
                    <option value="montagem_e_manutecao_em_microcomputadores_e_redes">Montagem e Manutecao em microcomputadores e redes</option>
                    <option value="montagem_e_manutecao_em_notebooks_perificos">Montagem e Manutecao em Notebooks   Perificos</option>
                    <option value="tecnico_em_informatica">Técnico em Informática</option>
                    <option value="analista_de_ti_e_sistema">Analista de TI e Sistemas</option>
                    
                </select>
            </div>
            <!-- 9ª textarea
               segunda-feira_D'noite,26/10/2026 
            -->
               <div>
                <label for="comment">Descreve como Você:</label>
                <textarea name="comment" cols="30" rows="10"></textarea>
               </div>
               <!-- 10ª fieldset e legend -->
                <div>
                    <fieldset>
                        <legend>Preencha as suas informações:</legend>
                        <label for="firstname">Nome:</label>
                        <input type="text" name="firstname">
                        <label for="lastname">Sobrenome:</label>
                        <input type="text" name="lastname" >
                    </fieldset>
                </div>
                <!-- 11ª Datalist
                   Terça-feira_D'noite,27/10/2026 
                -->
                   <div>
                    <label for="flavor">Escolha sua função</label>
                    <input type="text" list="flavors" name="flavor">
                    <datalist id="flavors">
                      <option value="Teste_de_software"></option>  
                      <option value="Analise_de_requisito"> </option> 
                      <option value="Programacao"> </option> 
                      <option value="Arquitetura_de_sistema"></option> 
                    </datalist>
                   </div>
                   <!-- 12ª Senha -->
                    <label for="password"> Informe sua senha: </label>
                    <input type="password" name="password">
                    <!-- 13ª Reiniciando o Form
                       Quarta-feira_D'noite, 28/10/2026
                    -->
                       <!-- 14 radio button-->
                        <div>
                            <label for="car_model">Escolha o modelo do seu carro:</label>
                            <div class="radio">
                                <input type="radio" value="bmw" name="car_model">
                                <label for="bmw">BMW</label>
                            </div>
                            <div class="radio">
                                <input type="radio" value="ferrari" name="car_model">
                                <label for="ferrari">ferrari</label>
                            </div>
                            <div class="radio">
                                <input type="radio" value="FIAT" name="car_model">
                                <label for="FIAT">FIAT</label>
                            </div>
                            <div class="radio">
                                <input type="radio" value="renault" name="car_model">
                                <label for="renault">renault</label>
                            </div>
                        </div>
                    <!-- 15ª Checkbox
                      Quinta-feira_D'noite,29/10/2026 
                    -->
                      <div>
                        <label for="optional">Opcionais do carro:</label>
                        <div class="radio">
                            <input type="checkbox" name="optionals[]" value="big_tires">
                            <label for="big_tires">Pneus Grandes</label>
                        </div>
                        <div class="radio">
                            <input type="checkbox" name="optionals[]" value="turbo_engine">
                            <label for="turbo_engine">Motor Turbo </label>
                        </div>
                        <div class="radio">
                            <input type="checkbox" name="optionals[]" value="hybrid">
                            <label for="hybrid">Motor Hibrido</label>
                           
                        </div>
                        
                      </div>
                      <!-- 16ª Datas -->
                      <div>
                        <label for="birthday"> Data de aniversário </label>
                        <input type="date" name="birthday" id="">
                      </div>
                      <!-- 17ª Arquivos -->
                       <div>
                        <label for="image"> Insira a sua imagem:</label>
                        <input type="file" name="image">
                       </div>
                       <!-- 18ª numeros -->
                        <div>
                            <label for="salary">Quanto você ganha no seu emprego atual?</label>
                           <input type="number" name="salary"> 
                        </div>
                        <!-- 19ª Emails -->
                         <div>
                            <label for="email"> Informe seu e-mail:</label>
                            <input type="email" name="email">
                         </div>
                         <!-- 20ª O atributo value
                            Sexta-feira_D'noite,30/10/2026 
                         -->
                            <div>
                                <label for="value">Digite algo valor:</label>
                                <input type="text" value="O meu valor é este" name="value">
                            </div>
                           
                             <div>
                             <!-- 21ª O atributo disabled -->
                              <p>Tentei alterar o valor:</p>
                              <input type="text" value="Nãp precisa Preencha" disabled>
                             </div>
                              <!-- 22ª O atributo placeholder  -->
                               <div>
                                <label for="current-job"> informe sua profissão:</label>
                                <input type="text" name="current-job" placeholder="No que voê está trabalhando agora?">
                               </div>
                                 <!-- 23ª O atributo required  -->
                                  <div>
                                    <label for="birthyear">Ano nascimento</label>
                                    <input type="text" placeholder="Digite o ano em que você nasce: ">
                                  </div>
                      <div class="finalizar">
                         <input type="reset" value="Limpar">
    
         <!-- 5ª envio de form -->
          <input type="submit" value="Cadastrar">
                       </div>

                      
     </form>
    </div>
  <marquee>Curso de HTML e CSS do básico ao avançado - com projetos</marquee>
</body>

</html>
