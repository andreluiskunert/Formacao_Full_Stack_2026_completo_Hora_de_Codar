<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Flex</title>
</head>
<body>
    <!-- 1ª Flex -->
    <div class="flex">
        <p>Meu</p>
        <p>Primeiro</p>
        <p>Elemento</p>
        <p>Com flex</p>
    </div>
    <!-- 2ª Column -->
    <div class="flex-column">
       <span>1</span> 
       <span>2</span>
       <span>3</span>
    </div>
   <!-- 3ª Wrap -->
    <div class="wrap">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
         <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
    <!-- 4ª Justify content
        terça-feira_D'Noite,24/11/2026 
    -->
        <h2>Center</h2>
        <div class="center">
            <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        </div>
        <h2>Space Around</h2>
        <div class="space-around">
         <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        </div>
        <h2>Space Between</h2>
        <div class="space-between">
            <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        </div>
         <h2>End</h2>
        <div class="end">
            <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        </div>
    <!-- 5ª align items -->
      <h2>Align-Center</h2>
        <div class="align-center">
            <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        </div>
        <h2>end</h2>
        <div class="flex-end">
            <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        </div>
        <h2>Stretch</h2>
        <div class="stretch">
            <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        </div>
        <!-- Quarta-feira_D'noite,25/11/2026
          6ª Gap  -->
          <h2>Gap</h2>
          <div class="gap">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        </div>
        <!-- 7ªOrder -->
         <h2>Order</h2>
         <div class="order">
         <div class="box" id="there">3</div>
        <div class="box" id="one">1</div>
        <div class="box" id="two">2</div>
         
         </div>
         <!-- 8ªGrow  -->
          <h2> Grow</h2>
          <div class="grow">
        <div class="box"></div>
        <div class="box big"></div>
        <div class="box"></div>
          </div>
          <!-- Quinta-feira_D'noite,26/11/2026
           9ª Basis-->
            <h2>Basis</h2>
          <div class="basis">
        <div class="box"></div>
        <div class="box big"></div>
        <div class="box"></div>
          </div>
          <!-- 10ªShrink -->
            <h2>Shrink</h2>
          <div class="shrink">
        <div class="box"></div>
        <div class="box small"></div>
        <div class="box"></div>
          </div>
           <!-- 11ªFlex shorthand -->
            <h2>Flex shorthand</h2>
          <div class="shorthand">
        <div class="box"></div>
        <div class="box different"></div>
        <div class="box"></div>
          </div>
          <!-- 12 - auto alinhamento -->
    <h2>Auto alinhamento</h2>
    <div class="auto-alignment">
      <div class="box"></div>
      <div class="box different"></div>
      <div class="box"></div>
 </body>
</html>
